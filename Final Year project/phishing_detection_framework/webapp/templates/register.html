<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - FinTech Shield AI</title>
    <!-- Tailwind CSS for premium responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(3, 7, 18, 0.70);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }
        .bg-cyber {
            background-image: url('{{ url_for("static", filename="images/login_bg_1772885685957.png") }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col md:flex-row h-screen overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Left side - Image Background -->
    <div class="hidden md:block md:w-7/12 lg:w-2/3 h-full bg-cyber relative md:order-1 order-2">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/40 to-transparent"></div>
        <div class="absolute inset-0 bg-indigo-900/10 mix-blend-overlay"></div>
    </div>

    <!-- Right side - Register Form -->
    <div class="w-full md:w-5/12 lg:w-1/3 h-full glass-panel z-10 flex flex-col justify-center px-8 sm:px-12 relative shadow-2xl md:order-2 order-1 overflow-y-auto">
        
        <div class="mb-8 mt-4">
            <div class="flex items-center space-x-3 mb-6">
                <!-- Simple Logo Placeholder -->
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 bg-opacity-20 border border-indigo-500/50 shadow-[0_0_15px_rgba(99,102,241,0.5)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Register Operator</h1>
            </div>
            
            {% if error %}
            <div class="bg-red-900/30 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-6 flex items-start shadow-[0_0_10px_rgba(239,68,68,0.2)]">
                <svg class="w-5 h-5 mr-2 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                </svg>
                <span class="text-sm font-medium">{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST" class="space-y-5">
                
                <!-- Role Selection -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-gray-400 tracking-wider"><span class="text-red-500">*</span> Role</label>
                    <div class="flex items-center space-x-6 pt-1 pb-2">
                        <label class="inline-flex items-center cursor-pointer group">
                            <input type="radio" name="role" value="admin" class="form-radio text-indigo-500 bg-gray-900 border-gray-700 focus:ring-indigo-500 focus:ring-offset-gray-900 w-4 h-4">
                            <span class="ml-2 text-sm text-gray-300 group-hover:text-white transition-colors">Admin</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer group">
                            <input type="radio" name="role" value="user" class="form-radio text-indigo-500 bg-gray-900 border-gray-700 focus:ring-indigo-500 focus:ring-offset-gray-900 w-4 h-4" checked>
                            <span class="ml-2 text-sm text-gray-300 group-hover:text-white transition-colors">User</span>
                        </label>
                    </div>
                </div>

                <!-- Username -->
                <div class="space-y-1">
                    <label for="username" class="block text-xs font-semibold text-gray-400 tracking-wider"><span class="text-red-500">*</span> Username (Create)</label>
                    <div class="relative">
                        <input type="text" id="username" name="username" class="input-glow block w-full px-4 py-3 border border-gray-700 bg-gray-900/50 text-white rounded-lg outline-none transition-all sm:text-sm placeholder-gray-500" placeholder="Mobile No. / Email / Admin Code" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label for="password" class="block text-xs font-semibold text-gray-400 tracking-wider"><span class="text-red-500">*</span> Password (Create)</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" class="input-glow block w-full px-4 py-3 border border-gray-700 bg-gray-900/50 text-white rounded-lg outline-none transition-all sm:text-sm placeholder-gray-500" placeholder="New Password" required>
                    </div>
                </div>
                
                <!-- Show Password Checkbox -->
                <div class="flex items-center pt-1 pb-2">
                    <input type="checkbox" id="show_password" class="rounded border-gray-700 bg-gray-900 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-gray-900 cursor-pointer w-4 h-4" onclick="togglePassword()">
                    <label for="show_password" class="ml-2 text-sm text-gray-400 cursor-pointer hover:text-gray-300 transition-colors">Show Password</label>
                </div>
                
                <script>
                    function togglePassword() {
                        var x = document.getElementById("password");
                        if (x.type === "password") {
                            x.type = "text";
                        } else {
                            x.type = "password";
                        }
                    }
                </script>

                <!-- Actions -->
                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-[0_0_15px_rgba(99,102,241,0.3)] text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 outline-none transition-all hover:scale-[1.02]">
                        Complete Registration
                    </button>
                </div>
                
                <div class="text-center pt-3 pb-2">
                    <a href="{{ url_for('login') }}" class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors font-medium relative underline decoration-indigo-400/30 underline-offset-4">Already have an account? Go back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
